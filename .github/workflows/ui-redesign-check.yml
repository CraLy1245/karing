name: UI Redesign Check

on:
  push:
    branches:
      - ui-redesign
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ui-redesign-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Karing
        uses: actions/checkout@v4
        with:
          path: karing

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare local VPN service placeholder
        run: |
          mkdir -p vpn-service/lib
          cat > vpn-service/pubspec.yaml <<'EOF'
          name: vpn_service
          description: CI placeholder for Karing's separately maintained sibling package.
          version: 0.0.0
          publish_to: none
          environment:
            sdk: '>=3.0.0 <4.0.0'
          EOF
          cat > vpn-service/lib/vpn_service.dart <<'EOF'
          library vpn_service;
          EOF
          cat > vpn-service/lib/state.dart <<'EOF'
          enum FlutterVpnServiceState {
            invalid,
            disconnected,
            connecting,
            connected,
            disconnecting,
            reasserting,
          }

          class SubscriptionTraffic {
            String upload = '';
            String download = '';
            String total = '';
            bool overQuota = false;

            dynamic getExpireTime(String languageTag) => null;
          }
          EOF

      - name: Resolve dependencies
        working-directory: karing
        run: flutter pub get

      - name: Format migrated UI source
        working-directory: karing
        run: |
          dart format \
            lib/design_system \
            lib/design_preview_main.dart \
            lib/screens/design_preview_screen.dart \
            lib/screens/theme_data_light.dart \
            lib/screens/theme_data_dark.dart \
            lib/screens/theme_define.dart \
            lib/screens/theme_config.dart \
            lib/screens/common_widget.dart \
            lib/screens/group_item_creator.dart \
            lib/screens/group_item_widgets.dart \
            lib/screens/listview_multi_parts_builder.dart \
            lib/screens/widgets/card.dart \
            lib/screens/widgets/fab2.dart \
            lib/screens/widgets/sheet.dart

      - name: Analyze migrated UI modules
        working-directory: karing
        run: |
          dart analyze lib/design_system
          dart analyze lib/design_preview_main.dart
          dart analyze lib/screens/design_preview_screen.dart
          dart analyze lib/screens/theme_data_light.dart
          dart analyze lib/screens/theme_data_dark.dart
          dart analyze lib/screens/theme_define.dart
          dart analyze lib/screens/theme_config.dart
          dart analyze lib/screens/common_widget.dart
          dart analyze lib/screens/group_item_creator.dart
          dart analyze lib/screens/group_item_widgets.dart
          dart analyze lib/screens/listview_multi_parts_builder.dart
          dart analyze lib/screens/widgets/card.dart
          dart analyze lib/screens/widgets/fab2.dart
          dart analyze lib/screens/widgets/sheet.dart

      - name: Commit formatter output
        if: github.event_name == 'push'
        working-directory: karing
        run: |
          if git diff --quiet; then
            echo "Source is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/design_system \
            lib/design_preview_main.dart \
            lib/screens/design_preview_screen.dart \
            lib/screens/theme_data_light.dart \
            lib/screens/theme_data_dark.dart \
            lib/screens/theme_define.dart \
            lib/screens/theme_config.dart \
            lib/screens/common_widget.dart \
            lib/screens/group_item_creator.dart \
            lib/screens/group_item_widgets.dart \
            lib/screens/listview_multi_parts_builder.dart \
            lib/screens/widgets/card.dart \
            lib/screens/widgets/fab2.dart \
            lib/screens/widgets/sheet.dart
          git commit -m "style: format migrated UI source"
          git push origin HEAD:ui-redesign

      - name: Upload formatted UI source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-ui-source
          retention-days: 1
          if-no-files-found: error
          path: |
            karing/lib/design_system
            karing/lib/design_preview_main.dart
            karing/lib/screens/design_preview_screen.dart
            karing/lib/screens/theme_data_light.dart
            karing/lib/screens/theme_data_dark.dart
            karing/lib/screens/theme_define.dart
            karing/lib/screens/theme_config.dart
            karing/lib/screens/common_widget.dart
            karing/lib/screens/group_item_creator.dart
            karing/lib/screens/group_item_widgets.dart
            karing/lib/screens/listview_multi_parts_builder.dart
            karing/lib/screens/widgets/card.dart
            karing/lib/screens/widgets/fab2.dart
            karing/lib/screens/widgets/sheet.dart
